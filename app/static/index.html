<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatlog AI - 实时聊天分析</title>
    <style>
        :root {
            --page: #edf5f1;
            --surface: #ffffff;
            --surface-alt: #f5faf7;
            --border: #d7e5dc;
            --border-strong: #b8d1c1;
            --text: #183328;
            --muted: #668074;
            --green: #07a85b;
            --green-soft: #e8f7ee;
            --blue: #2875a9;
            --blue-soft: #eaf3fa;
            --accent: #b36b1e;
            --accent-soft: #fff4e4;
            --danger: #b3261e;
            --shadow: 0 10px 28px rgba(30, 72, 51, 0.12);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            overflow: hidden;
            color: var(--text);
            background: var(--page);
            font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
            font-size: 14px;
        }
        button, input, select { font: inherit; }
        button { letter-spacing: 0; }

        .app-shell {
            height: 100vh;
            display: grid;
            grid-template-columns: 300px minmax(360px, 1fr) 8px minmax(360px, 440px);
            overflow: hidden;
        }

        .sidebar, .messages-pane, .ai-pane {
            min-width: 0;
            min-height: 0;
            background: var(--surface);
        }
        .sidebar, .messages-pane { border-right: 1px solid var(--border); }
        .pane-splitter { position: relative; z-index: 4; cursor: col-resize; background: #d4e6da; }
        .pane-splitter::after { content: ""; position: absolute; inset: 35% 2px; border-radius: 4px; background: #8fbaa0; }
        body.is-resizing, body.is-resizing * { cursor: col-resize !important; user-select: none !important; }
        .sidebar { display: flex; flex-direction: column; }

        .sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #f7fcf9, #ffffff); }
        .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { color: #16794b; font-size: 19px; font-weight: 800; letter-spacing: 0; }
        .icon-actions { display: flex; gap: 6px; }

        .icon-btn, .btn {
            min-height: 34px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            color: var(--text);
            background: var(--surface);
            cursor: pointer;
        }
        .icon-btn { width: 34px; padding: 0; font-size: 18px; line-height: 32px; }
        .btn { padding: 7px 12px; font-weight: 600; }
        .icon-btn:hover, .btn:hover { background: var(--surface-alt); }
        .btn:disabled { cursor: wait; opacity: 0.55; }
        .btn-primary { color: #fff; border-color: #146097; background: var(--blue); }
        .btn-primary:hover { background: #125a91; }
        .btn-danger { color: var(--danger); border-color: #e3aaa6; }

        .platform-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            margin-top: 14px;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface-alt);
        }
        .platform-tab {
            height: 34px;
            border: 0;
            border-radius: 5px;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
            font-weight: 700;
        }
        .platform-tab.active-wechat { color: var(--green); background: var(--green-soft); }
        .platform-tab.active-qq { color: var(--blue); background: var(--blue-soft); }

        .source-status {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            min-height: 38px;
            margin-top: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            background: var(--surface-alt);
            font-size: 12px;
            line-height: 18px;
        }
        .status-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 5px; border-radius: 50%; background: #a3abb5; }
        .source-status.ready .status-dot { background: var(--green); }
        .source-status.error { color: var(--danger); background: #fff5f4; border-color: #efc0bc; }
        .source-status.error .status-dot { background: var(--danger); }

        .search-wrap { position: relative; margin-top: 10px; }
        .search-wrap input {
            width: 100%; height: 36px; padding: 0 10px 0 32px;
            border: 1px solid var(--border-strong); border-radius: 6px; outline: none;
        }
        .search-wrap input:focus, .field:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(23, 105, 170, 0.12); }
        .search-mark { position: absolute; left: 10px; top: 8px; color: var(--muted); }

        .chat-list { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; }
        .chat-item {
            width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto;
            gap: 10px; align-items: center; padding: 11px 14px;
            border: 0; border-bottom: 1px solid #edf3ee; background: var(--surface);
            text-align: left; cursor: pointer;
        }
        .chat-item:hover { background: #f3faf5; }
        .chat-item.active { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
        .avatar {
            width: 40px; height: 40px; display: grid; place-items: center;
            border-radius: 12px; color: #fff; background: #687583; font-weight: 700;
        }
        .wechat-avatar { background: var(--green); }
        .qq-avatar { background: var(--blue); }
        .chat-copy { min-width: 0; }
        .chat-line { display: flex; align-items: baseline; gap: 8px; }
        .chat-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; }
        .chat-time { flex: 0 0 auto; color: #8a949f; font-size: 11px; }
        .chat-preview { margin-top: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
        .unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; color: #fff; background: var(--danger); text-align: center; line-height: 20px; font-size: 11px; }

        .messages-pane, .ai-pane { display: flex; flex-direction: column; }
        .pane-header {
            min-height: 64px; padding: 10px 16px; display: flex; align-items: center;
            justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border);
        }
        .pane-title { min-width: 0; }
        .pane-title h1, .pane-title h2 { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 16px; letter-spacing: 0; }
        .pane-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
        .filter-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
        .filter-group { display: inline-flex; align-items: center; gap: 5px; padding: 4px 5px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-alt); }
        .filter-group .field-label { white-space: nowrap; }
        .select-field { height: 32px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 6px; outline: none; color: var(--text); background: var(--surface); }
        .field {
            width: 68px; height: 34px; padding: 0 8px; border: 1px solid var(--border-strong);
            border-radius: 6px; outline: none; background: var(--surface);
        }
        .compact-field { width: 72px; }
        .field-label { color: var(--muted); font-size: 12px; }

        .message-list { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 24px; background: linear-gradient(180deg, #eef8f2, #e8f3ee); }
        .message {
            max-width: 88%; margin: 0 0 10px; padding: 9px 11px;
            border: 1px solid #d5e6db; border-radius: 12px; background: var(--surface); box-shadow: 0 2px 7px rgba(41, 92, 62, 0.05);
        }
        .message.mine { margin-left: auto; border-color: #b9ddc9; background: var(--green-soft); }
        .message-meta { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
        .message-sender { color: var(--blue); font-weight: 700; }
        .message.mine .message-sender { color: var(--green); }
        .message-content { line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }

        .ai-toolbar { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-alt); }
        .analysis-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
        .analysis-tab { min-width: 0; height: 32px; padding: 0 5px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; }
        .analysis-tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
        .analysis-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--muted); font-size: 12px; }

        .ai-thread { flex: 1; min-height: 0; overflow: auto; padding: 15px; background: var(--surface); }
        .ai-turn { margin-bottom: 14px; }
        .ai-role { margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
        .ai-bubble { padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; line-height: 1.65; overflow-wrap: anywhere; position: relative; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; padding: 3px 6px; }
        .ai-turn.user .ai-bubble { background: var(--blue-soft); border-color: #bdd5e8; }
        .ai-turn.assistant .ai-bubble { background: var(--surface-alt); }
        .ai-bubble h1, .ai-bubble h2, .ai-bubble h3 { margin: 12px 0 6px; font-size: 15px; letter-spacing: 0; }
        .ai-bubble p { margin: 0 0 8px; }
        .ai-bubble ul { margin: 6px 0; padding-left: 20px; }

        .prompt-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
        .prompt-bar input { width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: 6px; outline: none; }

        .empty { height: 100%; min-height: 140px; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; line-height: 1.6; }
        .loading { color: var(--muted); }

        .modal-layer { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(23, 32, 42, 0.42); }
        .modal-layer.open { display: flex; }
        .modal { width: min(480px, 100%); max-height: calc(100vh - 40px); overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .modal-header h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
        .modal-body { padding: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 12px; }
        .form-group input { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 6px; outline: none; }
        .form-hint { margin-top: 5px; color: var(--muted); font-size: 11px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
        .hotkey-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 8px; }
        .hotkey-row input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 6px; outline: none; }
        .switch-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
        .switch-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; }
        .form-group input[type="checkbox"] { width: auto; height: auto; margin: 0; }
        .guard-target-list { max-height: 320px; overflow: auto; border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px; }
        .guard-target-item { padding: 5px 6px; border-radius: 4px; }
        .guard-target-item:hover { background: #f3faf5; }
        .guard-target-row { display: flex; align-items: center; gap: 8px; }
        .guard-target-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; cursor: pointer; flex: 1; }
        .guard-target-item input[type="checkbox"] { width: auto; height: auto; margin: 0; }
        .guard-target-prompt { width: 100%; height: 30px; margin-top: 6px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 6px; outline: none; font-size: 12px; box-sizing: border-box; }
        .guard-badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; color: #fff; }
        .guard-badge.friend { background: var(--blue); }
        .guard-badge.group { background: #2ba471; }

        @media (max-width: 1180px) {
            .app-shell { grid-template-columns: 280px minmax(330px, 1fr) 8px 380px; }
            .pane-header { align-items: flex-start; flex-direction: column; }
            .filter-row { justify-content: flex-start; }
        }
        @media (max-width: 900px) {
            body { overflow: auto; }
            .app-shell { height: auto; min-height: 100vh; grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: minmax(520px, 62vh) minmax(460px, auto); overflow: visible; }
            .sidebar { grid-row: 1 / 3; }
            .messages-pane { border-right: 0; }
            .pane-splitter { display: none; }
            .ai-pane { grid-column: 2; border-top: 1px solid var(--border); min-height: 460px; }
        }
        @media (max-width: 640px) {
            body { overflow: auto; }
            .app-shell { display: block; }
            .sidebar { height: 48vh; border-right: 0; border-bottom: 1px solid var(--border); }
            .messages-pane, .ai-pane { height: 72vh; border-right: 0; }
            .pane-header { min-height: 106px; }
            .message { max-width: 96%; }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <aside class="sidebar">
        <header class="sidebar-header">
            <div class="brand-row">
                <div class="brand">Chatlog AI</div>
                <div class="icon-actions">
                    <button class="icon-btn" type="button" title="刷新会话" aria-label="刷新会话" onclick="loadChats(false)">↻</button>
                    <button class="icon-btn btn-danger" type="button" title="退出" aria-label="退出" onclick="shutdownAll()">×</button>
                </div>
            </div>
            <div class="platform-tabs" role="tablist">
                <button id="wechatTab" class="platform-tab active-wechat" type="button" onclick="switchPlatform('wechat')">微信</button>
                <button id="qqTab" class="platform-tab" type="button" onclick="switchPlatform('qq')">QQ</button>
            </div>
            <div id="sourceStatus" class="source-status">
                <span class="status-dot"></span><span id="sourceStatusText">正在连接微信数据源</span>
            </div>
            <div class="search-wrap">
                <span class="search-mark">⌕</span>
                <input id="searchInput" type="search" placeholder="搜索会话" oninput="renderChatList()">
            </div>
        </header>
        <div id="chatList" class="chat-list"><div class="empty loading">正在读取真实会话</div></div>
    </aside>

    <section class="messages-pane">
        <header class="pane-header">
            <div class="pane-title">
                <h1 id="chatTitle">选择会话</h1>
                <p id="chatSubtitle">未选择实时会话</p>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <span class="field-label">时间</span>
                    <select id="timeMode" class="select-field" onchange="toggleRangeControls()" aria-label="时间范围">
                        <option value="none">不限制</option>
                        <option value="recent">最近</option>
                    </select>
                    <input id="timeValue" class="field compact-field" type="number" min="1" step="1" value="24" aria-label="时间数值">
                    <select id="timeUnit" class="select-field" aria-label="时间单位">
                        <option value="minutes">分钟</option>
                        <option value="hours" selected>小时</option>
                        <option value="days">天</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="field-label">消息</span>
                    <select id="countMode" class="select-field" onchange="toggleRangeControls()" aria-label="消息范围">
                        <option value="unlimited">不限制（最多读取 2000 条）</option>
                        <option value="recent" selected>最近</option>
                    </select>
                    <input id="countInput" class="field compact-field" type="number" min="1" max="2000" step="1" value="500" aria-label="最近条数">
                    <span class="field-label">条</span>
                </div>
                <button class="btn" type="button" onclick="reloadMessages()">应用</button>
            </div>
        </header>
        <div id="messageList" class="message-list"><div class="empty">请选择左侧会话</div></div>
    </section>

    <div id="paneSplitter" class="pane-splitter" role="separator" aria-label="调整分析区宽度" tabindex="0"></div>

    <section class="ai-pane">
        <header class="pane-header">
            <div class="pane-title">
                <h2>DeepSeek 分析</h2>
                <p id="modelStatus">尚未读取模型配置</p>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
                <button class="icon-btn" type="button" title="自动回复设置" aria-label="自动回复设置" onclick="openAutoReplyModal()">⚙</button>
                <button id="runButton" class="btn btn-primary" type="button" onclick="runPreset()">生成分析</button>
            </div>
        </header>
        <div class="ai-toolbar">
            <div class="analysis-tabs">
                <button class="analysis-tab active" type="button" data-type="general" onclick="selectAnalysisType(this)">综合总结</button>
                <button class="analysis-tab" type="button" data-type="meeting" onclick="selectAnalysisType(this)">会议纪要</button>
                <button class="analysis-tab" type="button" data-type="todo" onclick="selectAnalysisType(this)">待办事项</button>
                <button class="analysis-tab" type="button" data-type="topics" onclick="selectAnalysisType(this)">话题热点</button>
            </div>
            <div class="analysis-meta">
                <span id="analysisCount">将分析 0 条真实消息</span>
                <button class="btn" type="button" onclick="clearAiThread()">清空对话</button>
            </div>
            <div class="analysis-meta">
                <span id="autoReplyStatus" style="color:var(--muted)">自动回复：未启用</span>
            </div>
        </div>
        <div id="aiThread" class="ai-thread"><div class="empty">选择会话后可生成分析或直接提问</div></div>
        <div class="prompt-bar">
            <input id="promptInput" type="text" placeholder="向 DeepSeek 提问" onkeydown="handlePromptKey(event)">
            <button id="sendButton" class="btn btn-primary" type="button" onclick="sendCustomPrompt()">发送</button>
        </div>
    </section>
</main>

<div id="autoReplyModal" class="modal-layer">
    <div class="modal" style="width:min(560px, 100%);">
        <div class="modal-header">
            <h2>自动回复设置</h2>
            <button class="icon-btn" type="button" title="关闭" aria-label="关闭" onclick="closeAutoReplyModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; font-weight:700;">
                    <input type="checkbox" id="arEnabled"> 启用自动回复
                </label>
            </div>
            <div class="form-group">
                <label>守护会话（最多 8 个好友 + 3 个群聊）</label>
                <div id="guardTargetList" class="guard-target-list"></div>
                <div class="form-hint">仅微信会话支持自动回复；未勾选任何会话则不会守护。</div>
            </div>
            <div class="form-group">
                <label>上下文条数（含新消息）</label>
                <input type="number" id="arContextCount" min="1" max="2000" step="1" value="80">
            </div>
            <div class="form-group">
                <label>自定义回复提示词（可选，留空用默认）</label>
                <input type="text" id="arReplyPrompt" placeholder="例如：用简短、口语化的中文回复">
            </div>
            <div class="form-group">
                <label>微信快捷键</label>
                <div class="hotkey-row">
                    <span>打开微信</span>
                    <input type="text" id="hkOpen" placeholder="ctrl+alt+w">
                    <button class="btn" type="button" onclick="testHotkey('open_wechat')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>搜索会话</span>
                    <input type="text" id="hkSearch" placeholder="ctrl+f">
                    <button class="btn" type="button" onclick="testHotkey('search')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>粘贴</span>
                    <input type="text" id="hkPaste" placeholder="ctrl+v">
                    <button class="btn" type="button" onclick="testHotkey('paste')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>发送</span>
                    <input type="text" id="hkSend" placeholder="enter">
                    <button class="btn" type="button" onclick="testHotkey('send')">测试</button>
                </div>
            </div>
            <div class="form-group">
                <button class="btn btn-danger" type="button" onclick="testFullFlow()">测试完整发送流程</button>
                <div class="form-hint">会真实发送一条「这是一条 Chatlog AI 自动回复测试消息」到当前选中会话，请谨慎使用。</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" type="button" onclick="closeAutoReplyModal()">取消</button>
            <button class="btn btn-primary" type="button" onclick="saveAutoReplyConfig()">保存</button>
        </div>
    </div>
</div>

<script>
    let currentPlatform = 'wechat';
    let chats = [];
    let currentChat = null;
    let rawMessages = [];
    let visibleMessages = [];
    let analysisType = 'general';
    let aiHistory = [];
    let messageLoading = false;
    let autoReplyConfig = null;
    let guardChatOptions = [];

    window.addEventListener('load', async function () {
        setupPaneSplitter();
        toggleRangeControls();
        await loadConfigStatus();
        await loadAutoReplyConfig();
        await loadChats(true);
        window.setInterval(function () { loadChats(false); }, 10000);
        window.setInterval(function () { refreshMessages(); }, 5000);
        window.setInterval(refreshAutoReplyStatus, 3000);
    });

    function switchPlatform(platform) {
        if (currentPlatform === platform) return;
        currentPlatform = platform;
        currentChat = null;
        rawMessages = [];
        visibleMessages = [];
        aiHistory = [];
        document.getElementById('wechatTab').className = platform === 'wechat' ? 'platform-tab active-wechat' : 'platform-tab';
        document.getElementById('qqTab').className = platform === 'qq' ? 'platform-tab active-qq' : 'platform-tab';

        document.getElementById('chatSubtitle').textContent = '未选择实时会话';

        updateAnalysisCount();
        renderAiThread();
        loadChats(true);
    }

    async function loadChats(showLoading) {
        const list = document.getElementById('chatList');
        if (showLoading) list.innerHTML = '<div class="empty loading">正在读取真实会话</div>';
        try {
            const response = await fetch('/api/chats?platform=' + currentPlatform, { cache: 'no-store' });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '会话读取失败'));
            chats = Array.isArray(data.chats) ? data.chats : [];
            setSourceStatus(data.status_info && data.status_info.msg ? data.status_info.msg : '实时数据源已连接', 'ready');
            if (currentChat) currentChat = chats.find(function (item) { return item.id === currentChat.id; }) || currentChat;
            renderChatList();
        } catch (error) {
            chats = [];
            setSourceStatus(error.message || '数据源连接失败', 'error');
            list.innerHTML = '<div class="empty">' + escapeHtml(error.message || '数据源连接失败') + '</div>';
        }
    }

    async function saveHistory() {
        if (!currentChat || !aiHistory.length) return;
        try {
            await fetch('/api/history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_id: currentChat.id, history: aiHistory })
            });
        } catch (error) {
            console.error('Failed to save history:', error);
        }

    function setSourceStatus(text, state) {
        const element = document.getElementById('sourceStatus');
        element.className = 'source-status ' + state;
        document.getElementById('sourceStatusText').textContent = text;
    }

    function renderChatList() {
        const list = document.getElementById('chatList');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = chats.filter(function (chat) { return String(chat.name || '').toLowerCase().includes(query); });
        list.replaceChildren();
        if (!filtered.length) {
            list.innerHTML = '<div class="empty">没有匹配的真实会话</div>';
            return;
        }
        filtered.forEach(function (chat) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'chat-item' + (currentChat && currentChat.id === chat.id ? ' active' : '');
            button.addEventListener('click', function () { selectChat(chat.id); });

            const avatar = document.createElement('span');
            avatar.className = 'avatar ' + (currentPlatform === 'wechat' ? 'wechat-avatar' : 'qq-avatar');
            avatar.textContent = chat.type === 'group' ? '群' : (currentPlatform === 'wechat' ? '微' : 'Q');

            const copy = document.createElement('span');
            copy.className = 'chat-copy';
            const line = document.createElement('span');
            line.className = 'chat-line';
            const name = document.createElement('span');
            name.className = 'chat-name';
            name.textContent = chat.name || chat.id;
            const time = document.createElement('span');
            time.className = 'chat-time';
            time.textContent = shortTime(chat.last_time);
            line.append(name, time);
            const preview = document.createElement('span');
            preview.className = 'chat-preview';
            preview.textContent = chat.last_message || (chat.type === 'group' ? '群聊' : '私聊');
            copy.append(line, preview);
            button.append(avatar, copy);

            if (Number(chat.unread || 0) > 0) {
                const unread = document.createElement('span');
                unread.className = 'unread';
                unread.textContent = Number(chat.unread) > 99 ? '99+' : String(chat.unread);
                button.append(unread);
            }

        });

    async function selectChat(chatId) {
        currentChat = chats.find(function (chat) { return chat.id === chatId; });
        if (!currentChat) return;
        renderChatList();
        document.getElementById('chatTitle').textContent = currentChat.name;
        document.getElementById('chatSubtitle').textContent = (currentPlatform === 'wechat' ? '微信' : 'QQ') + ' · ' + (currentChat.type === 'group' ? '群聊' : '私聊') + ' · 实时来源';

        await reloadMessages();

    async function loadHistory() {
        if (!currentChat) {
            aiHistory = [];
            renderAiThread();
            return;
        }
        try {
            const response = await fetch(`/api/history?target_id=${currentChat.id}`, { cache: 'no-store' });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '历史记录加载失败'));
            aiHistory = data.history || [];
        } catch (error) {
            console.error('Failed to load history:', error);
            aiHistory = [];
        }
        renderAiThread();
    }

    function getRangeConfig() {
        const timeMode = document.getElementById('timeMode').value;
        const countMode = document.getElementById('countMode').value;
        const timeValue = Math.max(1, Number(document.getElementById('timeValue').value || 1));
        const countValue = Math.max(1, Math.min(2000, Number(document.getElementById('countInput').value || 500)));
        let recentHours = null;
        if (timeMode === 'recent') {
            const unit = document.getElementById('timeUnit').value;
            recentHours = unit === 'minutes' ? timeValue / 60 : (unit === 'days' ? timeValue * 24 : timeValue);
        }
        return {
            recentHours: recentHours,
            count: countMode === 'recent' ? countValue : null,
            requestLimit: countMode === 'recent' ? countValue : 2000
        };
    }

    function requestedLimit() {
        return getRangeConfig().requestLimit;
    }

    function toggleRangeControls() {
        const timeRecent = document.getElementById('timeMode').value === 'recent';
        const countRecent = document.getElementById('countMode').value === 'recent';
        document.getElementById('timeValue').disabled = !timeRecent;
        document.getElementById('timeUnit').disabled = !timeRecent;
        document.getElementById('countInput').disabled = !countRecent;
        document.getElementById('timeValue').setAttribute('aria-disabled', String(!timeRecent));
        document.getElementById('countInput').setAttribute('aria-disabled', String(!countRecent));
    }

    async function reloadMessages() {
        if (!currentChat || messageLoading) return;
        messageLoading = true;
        document.getElementById('messageList').innerHTML = '<div class="empty loading">正在读取真实消息</div>';
        try {
            await fetchMessages();
        } catch (error) {
            document.getElementById('messageList').innerHTML = '<div class="empty">' + escapeHtml(error.message || '消息读取失败') + '</div>';
        } finally {
            messageLoading = false;
        }
    }

    async function refreshMessages() {
        if (!currentChat || messageLoading) return;
        const autoReplyOn = autoReplyConfig && autoReplyConfig.enabled;
        if (document.hidden && !autoReplyOn) return;
        messageLoading = true;
        try { await fetchMessages(); } catch (error) { setSourceStatus(error.message || '实时刷新失败', 'error'); }
        finally { messageLoading = false; }
    }

    async function fetchMessages() {
        const selectedId = currentChat.id;
        const params = new URLSearchParams({
            target_id: selectedId,
            platform: currentPlatform,
            is_group: String(currentChat.type === 'group'),
            limit: String(requestedLimit())
        });
        const response = await fetch('/api/messages?' + params.toString(), { cache: 'no-store' });
        const data = await readJson(response);
        if (!response.ok || data.status !== 'success' || data.source_valid !== true) throw new Error(apiError(data, '消息读取失败'));
        if (!currentChat || currentChat.id !== selectedId) return;
        rawMessages = Array.isArray(data.messages) ? data.messages : [];
        applyFilters();
        setSourceStatus((currentPlatform === 'wechat' ? '微信' : 'QQ') + ' 实时数据源已连接', 'ready');
    }

    function applyFilters() {
        const range = getRangeConfig();
        let result = rawMessages.slice();
        if (range.recentHours !== null) {
            const cutoff = Date.now() / 1000 - range.recentHours * 3600;
            result = result.filter(function (message) {
                const timestamp = messageTimestamp(message);
                return timestamp !== null && timestamp >= cutoff;
            });
        }
        if (range.count !== null) result = result.slice(-range.count);
        visibleMessages = result;
        renderMessages();
        updateAnalysisCount();
    }

    function renderMessages() {
        const list = document.getElementById('messageList');
        list.replaceChildren();
        if (!visibleMessages.length) {
            list.innerHTML = '<div class="empty">当前筛选范围内没有真实消息</div>';
            return;
        }
        visibleMessages.forEach(function (message) {
            const item = document.createElement('article');
            item.className = 'message' + (message.sender === '我' ? ' mine' : '');
            const meta = document.createElement('div');
            meta.className = 'message-meta';
            const sender = document.createElement('span');
            sender.className = 'message-sender';
            sender.textContent = message.sender || '未知发送者';
            const time = document.createElement('time');
            time.textContent = message.time || '';
            meta.append(sender, time);
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = message.content || '[消息]';
            item.append(meta, content);
            list.append(item);
        });
        list.scrollTop = list.scrollHeight;
    }

    function selectAnalysisType(button) {
        analysisType = button.dataset.type || 'general';
        document.querySelectorAll('.analysis-tab').forEach(function (item) { item.classList.toggle('active', item === button); });
    }

    function runPreset() {
        const labels = { general: '请综合总结当前筛选范围内的聊天记录', meeting: '请整理会议纪要与关键决策', todo: '请提取待办事项、责任人和时间', topics: '请分析核心话题及关注度' };
        runAnalysis(labels[analysisType], analysisType);
    }

    function sendCustomPrompt() {
        const input = document.getElementById('promptInput');
        const prompt = input.value.trim();
        if (!prompt) return;
        input.value = '';
        runAnalysis(prompt, 'general');
    }

    function handlePromptKey(event) {

    }

    async function runAnalysis(prompt, type) {
        if (!currentChat) { window.alert('请先选择会话'); return; }
        if (!visibleMessages.length) { window.alert('当前筛选范围内没有消息'); return; }
        const runButton = document.getElementById('runButton');
        const sendButton = document.getElementById('sendButton');
        runButton.disabled = true;
        sendButton.disabled = true;
        aiHistory.push({ role: 'user', content: prompt });
        renderAiThread(true);
        try {
            const priorHistory = aiHistory.slice(0, -1).slice(-10);
            const response = await fetch('/api/summarize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    target_name: currentChat.name,
                    messages: visibleMessages,
                    type: type,
                    prompt: prompt,
                    history: priorHistory
                })
            });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, 'DeepSeek 请求失败'));
            aiHistory.push({ role: 'assistant', content: data.summary || '' });
            await saveHistory();
        } catch (error) {
            aiHistory.push({ role: 'assistant', content: '请求失败：' + (error.message || '未知错误'), error: true });
        } finally {
            runButton.disabled = false;
            sendButton.disabled = false;
            renderAiThread();
        }
    }

    function clearAiThread() { aiHistory = []; renderAiThread(); }

    function renderAiThread(waiting) {
        const thread = document.getElementById('aiThread');
        if (!aiHistory.length) {
            thread.innerHTML = '<div class="empty">选择会话后可生成分析或直接提问</div>';
            return;
        }
        thread.innerHTML = aiHistory.map(function (turn) {
            const roleName = turn.role === 'user' ? '你' : 'DeepSeek';
            const content = turn.role === 'assistant' ? renderMarkdown(turn.content) : '<p>' + escapeHtml(turn.content) + '</p>';
            const copyBtn = turn.role === 'assistant' ? `<button class="copy-btn" onclick="copyToClipboard(\'${escapeHtml(turn.content)}\')">复制</button>` : '';
            return '<div class="ai-turn ' + turn.role + '"><div class="ai-role">' + roleName + '</div><div class="ai-bubble"' + (turn.error ? ' style="color:var(--danger)"' : '') + '>' + content + copyBtn + '</div></div>';
        }).join('') + (waiting ? '<div class="ai-turn assistant"><div class="ai-role">DeepSeek</div><div class="ai-bubble loading">正在分析 ' + visibleMessages.length + ' 条消息</div></div>' : '');
        thread.scrollTop = thread.scrollHeight;
    }

    function updateAnalysisCount() {
        const range = getRangeConfig();
        const scope = range.count === null ? '最多 2000 条' : '最近 ' + range.count + ' 条';
        const timeScope = range.recentHours === null ? '不限制时间' : '最近 ' + formatHours(range.recentHours);
        document.getElementById('analysisCount').textContent = '将分析 ' + visibleMessages.length + ' 条真实消息（' + timeScope + '，' + scope + '）';
        document.getElementById('chatSubtitle').textContent = currentChat
            ? (currentPlatform === 'wechat' ? '微信' : 'QQ') + ' · ' + (currentChat.type === 'group' ? '群聊' : '私聊') + ' · 当前显示 ' + visibleMessages.length + ' 条'
            : '未选择实时会话';
    }

    function formatHours(hours) {
        if (hours < 1) return Math.round(hours * 60) + ' 分钟';
        if (hours % 24 === 0) return (hours / 24) + ' 天';
        return hours + ' 小时';
    }

    function setupPaneSplitter() {
        const splitter = document.getElementById('paneSplitter');
        const shell = document.querySelector('.app-shell');
        if (!splitter || !shell) return;
        let resizing = false;
        splitter.addEventListener('pointerdown', function (event) {
            if (window.innerWidth <= 900) return;
            resizing = true;
            splitter.setPointerCapture(event.pointerId);
            document.body.classList.add('is-resizing');
        });
        splitter.addEventListener('pointermove', function (event) {
            if (!resizing) return;
            const rect = shell.getBoundingClientRect();
            const aiWidth = Math.max(320, Math.min(620, rect.right - event.clientX));
            shell.style.gridTemplateColumns = '300px minmax(320px, 1fr) 8px ' + aiWidth + 'px';
        });
        function stopResize() {
            resizing = false;
            document.body.classList.remove('is-resizing');
        }
        splitter.addEventListener('pointerup', stopResize);
        splitter.addEventListener('pointercancel', stopResize);
        splitter.addEventListener('keydown', function (event) {
            if (window.innerWidth <= 900) return;
            const rect = shell.getBoundingClientRect();
            const current = parseFloat(getComputedStyle(shell).gridTemplateColumns.split(' ').pop()) || 440;
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
                event.preventDefault();
                const delta = event.key === 'ArrowLeft' ? 24 : -24;
                const aiWidth = Math.max(320, Math.min(620, current + delta));
                shell.style.gridTemplateColumns = '300px minmax(320px, 1fr) 8px ' + aiWidth + 'px';
            }
        });
        window.addEventListener('resize', function () {
            if (window.innerWidth <= 900) shell.style.gridTemplateColumns = '';
        });
    }

    async function readJson(response) {
        try { return await response.json(); } catch (error) { return {}; }
    }

    function apiError(data, fallback) { return data.detail || data.message || (data.status_info && data.status_info.msg) || fallback; }

    function messageTimestamp(message) {
        const value = message.timestamp !== undefined ? message.timestamp : message.time;
        const numeric = Number(value);
        if (String(value || '').trim() && !Number.isNaN(numeric)) return numeric > 100000000000 ? numeric / 1000 : numeric;
        const parsed = Date.parse(value);
        return Number.isNaN(parsed) ? null : parsed / 1000;
    }

    function shortTime(value) {
        if (!value) return '';
        const text = String(value);
        const match = text.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
        if (!match) return text.slice(0, 16);
        const today = new Date().toISOString().slice(0, 10);
        return match[1] === today ? match[2] : match[1].slice(5);
    }

    function renderMarkdown(markdown) {
        const lines = escapeHtml(markdown || '').split('\n');
        let html = '';
        let inList = false;
        lines.forEach(function (line) {
            const formatted = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            if (/^###\s+/.test(formatted)) { if (inList) { html += '</ul>'; inList = false; } html += '<h3>' + formatted.replace(/^###\s+/, '') + '</h3>'; }
            else if (/^##\s+/.test(formatted)) { if (inList) { html += '</ul>'; inList = false; } html += '<h2>' + formatted.replace(/^##\s+/, '') + '</h2>'; }
            else if (/^#\s+/.test(formatted)) { if (inList) { html += '</ul>'; inList = false; } html += '<h1>' + formatted.replace(/^#\s+/, '') + '</h1>'; }
            else if (/^[-*]\s+/.test(formatted)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + formatted.replace(/^[-*]\s+/, '') + '</li>'; }
            else { if (inList) { html += '</ul>'; inList = false; } if (formatted.trim()) html += '<p>' + formatted + '</p>'; }
        });
        if (inList) html += '</ul>';
        return html;
    }

    function escapeHtml(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(function () {
            alert('已复制到剪贴板');
        }, function (err) {
            alert('复制失败: ' + err);
        });
    }

    async function loadGuardChatOptions() {
        try {
            const response = await fetch('/api/chats?platform=wechat', { cache: 'no-store' });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '读取微信会话失败'));
            guardChatOptions = Array.isArray(data.chats) ? data.chats : [];
        } catch (error) {
            guardChatOptions = [];
        }
        renderGuardTargetList();
    }

    function renderGuardTargetList() {
        const container = document.getElementById('guardTargetList');
        if (!container) return;
        const cfg = autoReplyConfig || {};
        const selected = cfg.guard_targets || [];
        const selectedIds = {};
        selected.forEach(function (t) { selectedIds[t.id] = t; });
        const friendCount = selected.filter(function (t) { return t.type === 'friend'; }).length;
        const groupCount = selected.filter(function (t) { return t.type === 'group'; }).length;

        const list = guardChatOptions || [];
        if (!list.length) {
            container.innerHTML = '<div class="form-hint">正在加载微信会话……</div>';
            return;
        }

        container.replaceChildren();

        function renderGroup(title, items, type, currentCount, maxCount) {
            const header = document.createElement('div');
            header.className = 'form-hint';
            header.textContent = title + '（已选 ' + currentCount + '/' + maxCount + '）';
            container.appendChild(header);
            items.forEach(function (chat) {
                const selected = selectedIds[chat.id];
                const isChecked = !!selected;

                const item = document.createElement('div');
                item.className = 'guard-target-item';

                const row = document.createElement('div');
                row.className = 'guard-target-row';

                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.dataset.id = chat.id;
                checkbox.dataset.name = chat.name || chat.id;
                checkbox.dataset.type = type;
                checkbox.checked = isChecked;
                checkbox.disabled = !isChecked && currentCount >= maxCount;
                label.appendChild(checkbox);
                const nameSpan = document.createElement('span');
                nameSpan.textContent = chat.name || chat.id;
                label.appendChild(nameSpan);

                const badge = document.createElement('span');
                badge.className = 'guard-badge ' + type;
                badge.textContent = type === 'friend' ? '好友' : '群聊';

                row.appendChild(label);
                row.appendChild(badge);
                item.appendChild(row);

                const promptInput = document.createElement('input');
                promptInput.type = 'text';
                promptInput.className = 'guard-target-prompt';
                promptInput.dataset.id = chat.id;
                promptInput.placeholder = '单独提示词（可选，留空用默认）';
                promptInput.value = (selected && selected.prompt) ? selected.prompt : '';
                promptInput.style.display = isChecked ? 'block' : 'none';
                item.appendChild(promptInput);

                checkbox.addEventListener('change', function () {
                    promptInput.style.display = checkbox.checked ? 'block' : 'none';
                });

                container.appendChild(item);
            });
        }

        renderGroup('好友', list.filter(function (c) { return c.type !== 'group'; }), 'friend', friendCount, 8);
        renderGroup('群聊', list.filter(function (c) { return c.type === 'group'; }), 'group', groupCount, 3);
    }

    function collectGuardTargets() {
        const prompts = {};
        document.querySelectorAll('#guardTargetList input.guard-target-prompt').forEach(function (input) {
            prompts[input.dataset.id] = input.value.trim();
        });
        const targets = [];
        document.querySelectorAll('#guardTargetList input[type=checkbox]').forEach(function (cb) {
            if (cb.checked) {
                targets.push({
                    id: cb.dataset.id,
                    name: cb.dataset.name,
                    type: cb.dataset.type,
                    prompt: prompts[cb.dataset.id] || ''
                });
            }
        });
        return targets;
    }

    async function saveAutoReplyConfig() {
        const payload = {
            enabled: document.getElementById('arEnabled').checked,
            guard_targets: collectGuardTargets(),
            context_count: Number(document.getElementById('arContextCount').value || 80),
            reply_prompt: document.getElementById('arReplyPrompt').value.trim(),
            hotkeys: {
                open_wechat: document.getElementById('hkOpen').value.trim(),
                search: document.getElementById('hkSearch').value.trim(),
                paste: document.getElementById('hkPaste').value.trim(),
                send: document.getElementById('hkSend').value.trim()
            }
        };
        try {
            const response = await fetch('/api/auto-reply/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '保存失败'));
            autoReplyConfig = data.config || payload;
            applyAutoReplyConfigToForm();
            updateAutoReplyStatus();
            closeAutoReplyModal();
        } catch (error) {
            window.alert('保存自动回复配置失败：' + (error.message || '未知错误'));
        }
    }

    function updateAutoReplyStatus() {
        const el = document.getElementById('autoReplyStatus');
        const cfg = autoReplyConfig || {};
        if (!cfg.enabled) { el.textContent = '自动回复：未启用'; return; }
        const count = (cfg.guard_targets || []).length;
        el.textContent = '自动回复：已启用（守护 ' + count + ' 个会话，最近 ' + (cfg.context_count || 80) + ' 条上下文）';
    }

    async function refreshAutoReplyStatus() {
        try {
            const response = await fetch('/api/auto-reply/status', { cache: 'no-store' });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') return;
            const el = document.getElementById('autoReplyStatus');
            if (!data.enabled) { el.textContent = '自动回复：未启用'; return; }
            const running = data.running ? '运行中' : '未运行';
            const latest = (data.log && data.log.length) ? data.log[data.log.length - 1].message : '';
            el.textContent = '自动回复：' + running + (latest ? ' · ' + latest : '');
        } catch (error) {}
    }

    async function testHotkey(name) {
        try {
            const response = await fetch('/api/auto-reply/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: name }) });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '测试失败'));
            window.alert(data.message || '已触发');
        } catch (error) {
            window.alert('测试失败：' + (error.message || '未知错误'));
        }
    }

    async function testFullFlow() {
        if (!currentChat) { window.alert('请先选择一个会话'); return; }
        if (!window.confirm('将真实发送一条测试消息到「' + currentChat.name + '」，确认继续？')) return;
        try {
            const response = await fetch('/api/auto-reply/test', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'full', target_name: currentChat.name, text: '这是一条 Chatlog AI 自动回复测试消息' })
            });
            const data = await readJson(response);
            if (!response.ok || data.status !== 'success') throw new Error(apiError(data, '测试失败'));
            window.alert(data.message || '已执行');
        } catch (error) {
            window.alert('完整流程测试失败：' + (error.message || '未知错误'));
        }
    }
</script>
</body>
</html>
