<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatlog AI - 实时聊天分析</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="app-shell">
    <aside class="sidebar">
        <header class="sidebar-header">
            <div class="brand-row">
                <div class="brand">Chatlog AI</div>
                <div class="icon-actions">
                    <button class="icon-btn" type="button" title="刷新会话" aria-label="刷新会话" onclick="loadChats(false)">↻</button>
                    <button class="icon-btn btn-danger" type="button" title="退出" aria-label="退出" onclick="shutdownAll()">×</button>
                </div>
            </div>
            <div id="sourceStatus" class="source-status">
                <span class="status-dot"></span><span id="sourceStatusText">正在连接微信数据源</span>
            </div>
            <div class="search-wrap">
                <span class="search-mark">⌕</span>
                <input id="searchInput" type="search" placeholder="搜索会话" oninput="renderChatList()">
            </div>
        </header>
        <div id="chatList" class="chat-list"><div class="empty loading">正在读取真实会话</div></div>
    </aside>

    <section class="messages-pane">
        <header class="pane-header">
            <div class="pane-title">
                <h1 id="chatTitle">选择会话</h1>
                <p id="chatSubtitle">未选择实时会话</p>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <span class="field-label">时间</span>
                    <select id="timeMode" class="select-field" onchange="toggleRangeControls()" aria-label="时间范围">
                        <option value="none">不限制</option>
                        <option value="recent">最近</option>
                    </select>
                    <input id="timeValue" class="field compact-field" type="number" min="1" step="1" value="24" aria-label="时间数值">
                    <select id="timeUnit" class="select-field" aria-label="时间单位">
                        <option value="minutes">分钟</option>
                        <option value="hours" selected>小时</option>
                        <option value="days">天</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="field-label">消息</span>
                    <select id="countMode" class="select-field" onchange="toggleRangeControls()" aria-label="消息范围">
                        <option value="unlimited">不限制（最多读取 2000 条）</option>
                        <option value="recent" selected>最近</option>
                    </select>
                    <input id="countInput" class="field compact-field" type="number" min="1" max="2000" step="1" value="500" aria-label="最近条数">
                    <span class="field-label">条</span>
                </div>
                <button class="btn" type="button" onclick="reloadMessages()">应用</button>
            </div>
        </header>
        <div id="messageList" class="message-list"><div class="empty">请选择左侧会话</div></div>
    </section>

    <div id="paneSplitter" class="pane-splitter" role="separator" aria-label="调整分析区宽度" tabindex="0"></div>

    <section class="ai-pane">
        <header class="pane-header">
            <div class="pane-title">
                <h2>AI 分析</h2>
                <p id="modelStatus">尚未配置模型</p>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
                <button class="btn" type="button" title="模型与 API Key 设置" aria-label="模型设置" onclick="openModelModal()">模型设置</button>
                <button class="icon-btn" type="button" title="自动回复设置" aria-label="自动回复设置" onclick="openAutoReplyModal()">⚙</button>
                <button id="runButton" class="btn btn-primary" type="button" onclick="runPreset()">生成分析</button>
            </div>
        </header>
        <div class="ai-toolbar">
            <div class="analysis-tabs">
                <button class="analysis-tab active" type="button" data-type="general" onclick="selectAnalysisType(this)">综合总结</button>
                <button class="analysis-tab" type="button" data-type="meeting" onclick="selectAnalysisType(this)">会议纪要</button>
                <button class="analysis-tab" type="button" data-type="todo" onclick="selectAnalysisType(this)">待办事项</button>
                <button class="analysis-tab" type="button" data-type="topics" onclick="selectAnalysisType(this)">话题热点</button>
            </div>
            <div class="analysis-meta">
                <span id="analysisCount">将分析 0 条真实消息</span>
                <button class="btn" type="button" onclick="clearAiThread()">清空对话</button>
            </div>
            <div class="analysis-meta">
                <span id="autoReplyStatus" style="color:var(--muted)">自动回复：未启用</span>
            </div>
            <div class="analysis-meta">
                <span id="balanceStatus" style="color:var(--muted)">余额：未查询</span>
                <button class="btn" type="button" onclick="refreshBalance()">刷新余额</button>
            </div>
        </div>
        <div id="aiThread" class="ai-thread"><div class="empty">选择会话后可生成分析或直接提问</div></div>
        <div class="prompt-bar">
            <input id="promptInput" type="text" placeholder="向 AI 提问" onkeydown="handlePromptKey(event)">
            <button id="sendButton" class="btn btn-primary" type="button" onclick="sendCustomPrompt()">发送</button>
        </div>
    </section>
</main>

<div id="autoReplyModal" class="modal-layer">
    <div class="modal" style="width:min(560px, 100%);">
        <div class="modal-header">
            <h2>自动回复设置</h2>
            <button class="icon-btn" type="button" title="关闭" aria-label="关闭" onclick="closeAutoReplyModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; font-weight:700;">
                    <input type="checkbox" id="arEnabled"> 启用自动回复
                </label>
            </div>
            <div class="form-group">
                <label>守护会话（最多 8 个好友 + 3 个群聊）</label>
                <div id="guardTargetList" class="guard-target-list"></div>
                <div class="form-hint">仅微信会话支持自动回复；未勾选任何会话则不会守护。</div>
            </div>
            <div class="form-group">
                <label>上下文条数（含新消息）</label>
                <input type="number" id="arContextCount" min="1" max="2000" step="1" value="80">
            </div>
            <div class="form-group">
                <label>自定义回复提示词（可选，留空用默认）</label>
                <input type="text" id="arReplyPrompt" placeholder="例如：用简短、口语化的中文回复">
            </div>
            <div class="form-group">
                <label>微信快捷键</label>
                <div class="hotkey-row">
                    <span>打开微信</span>
                    <input type="text" id="hkOpen" placeholder="ctrl+alt+w">
                    <button class="btn" type="button" onclick="testHotkey('open_wechat')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>搜索会话</span>
                    <input type="text" id="hkSearch" placeholder="ctrl+f">
                    <button class="btn" type="button" onclick="testHotkey('search')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>粘贴</span>
                    <input type="text" id="hkPaste" placeholder="ctrl+v">
                    <button class="btn" type="button" onclick="testHotkey('paste')">测试</button>
                </div>
                <div class="hotkey-row">
                    <span>发送</span>
                    <input type="text" id="hkSend" placeholder="enter">
                    <button class="btn" type="button" onclick="testHotkey('send')">测试</button>
                </div>
            </div>
            <div class="form-group">
                <button class="btn btn-danger" type="button" onclick="testFullFlow()">测试完整发送流程</button>
                <div class="form-hint">会真实发送一条「这是一条 Chatlog AI 自动回复测试消息」到当前选中会话，请谨慎使用。</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" type="button" onclick="closeAutoReplyModal()">取消</button>
            <button class="btn btn-primary" type="button" onclick="saveAutoReplyConfig()">保存</button>
        </div>
    </div>
</div>

<div id="modelModal" class="modal-layer">
    <div class="modal" style="width:min(640px, 100%);">
        <div class="modal-header">
            <h2>模型与 API Key 设置</h2>
            <button class="icon-btn" type="button" title="关闭" aria-label="关闭" onclick="closeModelModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>已配置的模型供应商</label>
                <div id="providerList" class="provider-list"></div>
            </div>
            <div class="form-group">
                <label style="margin-bottom:10px;">添加 / 修改供应商</label>
                <div class="form-group">
                    <label>供应商类型</label>
                    <select id="mpType" class="select-field" style="width:100%;height:38px;" onchange="onProviderTypeChange()"></select>
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="mpName" placeholder="例如：我的 DeepSeek">
                </div>
                <div class="form-group">
                    <label>Base URL</label>
                    <input type="text" id="mpBaseUrl" placeholder="https://api.deepseek.com">
                </div>
                <div class="form-group">
                    <label>模型名</label>
                    <input type="text" id="mpModel" placeholder="deepseek-chat">
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="mpApiKey" placeholder="sk-...">
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn" type="button" id="mpValidateBtn" onclick="validateProvider()">验证 Key</button>
                    <button class="btn btn-primary" type="button" id="mpSaveBtn" onclick="saveProvider()" disabled>添加 / 保存</button>
                </div>
                <div id="mpValidateMsg" class="form-hint"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" type="button" onclick="closeModelModal()">关闭</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
